# Home Assistant package: power-on volume init for a Cyrus ONE / ONE HD
# amplifier controlled through an ESP32 running the firmware from the
# `esphome/` directory of this repository.
#
# The amplifier is powered through a Shelly Plug S Gen3 that the ESP32
# switches directly over local Shelly RPC. The ESP32 is STATELESS about the
# plug: it accepts the target IP with every request (cyrus_plug_set) and
# reports raw results (Cyrus Plug OK / Cyrus Plug Diagnostic). All
# configuration lives here, in HA:
#
#   input_boolean.cyrus_plug_enabled - turn the whole plug feature on/off
#     (off = no IP needed, no diagnostics, Cyrus Amp unavailable)
#   input_text.cyrus_plug_ip - the Shelly's LAN address (validated IPv4)
#
# Power-on flow:
#   Cyrus Amp on -> plug set on (RPC via ESP32) -> amp boots -> ESP32 scans
#   for the amp (two-MAC boot sequence) -> connects -> writes the startup
#   volume -> stays connected as the BLE relay ->
#   `binary_sensor.<device>_cyrus_volume_set` pulses on success.
#
# Include this file from configuration.yaml, e.g.:
#   homeassistant:
#     packages: !include_dir_named packages
# and place this file as packages/cyrus_remote.yaml.

# Absolute startup volume 0-90 (36 = roughly -40 dB on the Cyrus scale).
# Change this to taste. Clamped to the Cyrus Volume Limit on the ESP32.
input_number:
  cyrus_startup_volume:
    name: "Cyrus startup volume"
    min: 0
    max: 90
    step: 1
    initial: 36
    icon: mdi:volume-high

# Plug feature configuration (owned by HA, applied to the stateless ESP32).
input_boolean:
  cyrus_plug_enabled:
    name: "Cyrus plug enabled"
    icon: mdi:power-socket-eu

input_text:
  cyrus_plug_ip:
    name: "Cyrus plug IP"
    icon: mdi:ip-network
    # Format is validated where it is used (availability/monitor templates
    # via regex_match); a `pattern` here rejects the initial 'unknown' state.

template:
  # UI switch driving the Shelly through the ESP32. Available only when the
  # feature is enabled AND the configured IP is a valid IPv4 (the `ipaddr`
  # template filter rejects anything else).
  - switch:
      - name: "Cyrus Amp Plug"
        unique_id: cyrus_amp_plug_switch
        state: "{{ is_state('binary_sensor.cyrus_remote_cyrus_plug_state', 'on') }}"
        availability: >-
          {{ is_state('input_boolean.cyrus_plug_enabled', 'on')
             and (states('input_text.cyrus_plug_ip') | regex_match('^(\\d{1,3}\\.){3}\\d{1,3}$')) }}
        turn_on:
          - service: esphome.cyrus_remote_cyrus_plug_set
            data:
              ip: "{{ states('input_text.cyrus_plug_ip') }}"
              # Quoted: 'on' is a YAML 1.1 boolean key and would be parsed
              # as True, failing the service schema validation.
              "on": true
        turn_off:
          - service: esphome.cyrus_remote_cyrus_plug_set
            data:
              ip: "{{ states('input_text.cyrus_plug_ip') }}"
              "on": false
  # NOTE: this package intentionally does NOT define the user-facing
  # "Cyrus Amp" switch - you wire your own (existing) switch/script to
  # `switch.cyrus_amp_plug` so the power-on flow (plug on -> BLE connect ->
  # startup volume) runs through the ESP32:
  #
  #   state: "{{ is_state('switch.cyrus_amp_plug', 'on') }}"
  #   availability: "{{ states('switch.cyrus_amp_plug') not in ['unknown', 'unavailable'] }}"
  #   turn_off -> switch.turn_off on switch.cyrus_amp_plug

automation:
  # Apply the plug configuration to the stateless ESP32: (re)start
  # Switch.Get polling at the configured IP, or stop it when the feature is
  # off / the IP is invalid. The time_pattern trigger re-applies the config
  # after an ESP reboot (e.g. the volume-limit restart), which wipes the
  # ESP-side monitoring state.
  - alias: "Cyrus plug monitor apply"
    id: cyrus_plug_monitor_apply
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_boolean.cyrus_plug_enabled
      - platform: state
        entity_id: input_text.cyrus_plug_ip
      - platform: time_pattern
        minutes: "/15"
    action:
      - service: esphome.cyrus_remote_cyrus_plug_monitor
        data:
          ip: >
            {{ states('input_text.cyrus_plug_ip')
               if is_state('input_boolean.cyrus_plug_enabled', 'on')
                  and (states('input_text.cyrus_plug_ip') | regex_match('^(\\d{1,3}\\.){3}\\d{1,3}$'))
               else '' }}

  # Covers the case where the plug is switched on outside of HA
  # (physical button on the plug, vendor app): the ESP32 polls the Shelly
  # state, so the entity below flips within ~10 s and the flow still runs.
  - alias: "Cyrus amp powered on"
    id: cyrus_amp_powered_on
    trigger:
      - platform: state
        entity_id: binary_sensor.cyrus_remote_cyrus_plug_state
        to: "on"
    condition:
      # The script itself turns the plug on; don't run twice.
      - condition: state
        entity_id: script.cyrus_amp_turn_on_with_volume
        state: "off"
    action:
      - service: script.cyrus_amp_turn_on_with_volume

  # The volume slider range is only announced to HA at connect time, so a
  # live volume-limit change flags binary_sensor...restart_required. Surface
  # it as a notification; pressing the button.cyrus_remote_cyrus_restart
  # button reboots the ESP32 and the new slider range appears.
  - alias: "Cyrus restart required after limit change"
    id: cyrus_restart_required_notify
    trigger:
      - platform: state
        entity_id: binary_sensor.cyrus_remote_cyrus_restart_required
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Cyrus: restart required"
          message: >-
            The volume limit changed. Press button.cyrus_remote_cyrus_restart
            to reboot the controller and apply the new volume slider range.
          notification_id: cyrus_restart_required

  # Plug problems reported by the stateless ESP32: unreachable (no Shelly
  # answering at the configured IP) or invalid ip. Only raised while the
  # feature is enabled; the raw entity states stay visible for debugging
  # when the plug is disabled.
  - alias: "Cyrus plug problem"
    id: cyrus_plug_problem_notify
    trigger:
      - platform: state
        entity_id: sensor.cyrus_remote_cyrus_plug_diagnostic
        to:
          - "unreachable"
          - "invalid ip"
    condition:
      - condition: state
        entity_id: input_boolean.cyrus_plug_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Cyrus: plug problem"
          message: >-
            Shelly plug: {{ trigger.to_state.state }}.
            {{ 'Check that the Shelly Plug S Gen3 is powered, on the same LAN as the ESP32, and has local authentication disabled (Digest auth is not supported).' if trigger.to_state.state == 'unreachable' else 'Fix the IP in input_text.cyrus_plug_ip - it must be a valid IPv4 address.' }}
          notification_id: cyrus_plug_problem

  - alias: "Cyrus plug problem cleared"
    id: cyrus_plug_problem_dismiss
    trigger:
      - platform: state
        entity_id: sensor.cyrus_remote_cyrus_plug_diagnostic
        to: "ok"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: cyrus_plug_problem

# Power-on script used by the "Cyrus amp powered on" automation below.
# Fresh installs can use it as-is; if you already have your own power-on
# script (e.g. one that also handles a startup lock or other devices),
# delete this block and point the automation's condition/action at yours.
script:
  cyrus_amp_turn_on_with_volume:
    alias: "Turn on Cyrus amp and set volume"
    mode: single
    sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.cyrus_amp_plug
      # The ESP32 scans for the two MAC advertisements of the amplifier,
      # connects over BLE, writes the volume and stays connected. It pulses
      # binary_sensor.<device>_cyrus_volume_set when done
      # (normally ~8 s after power-on; 30 s timeout as a safety net).
      # NOTE: replace `cyrus_remote` with your ESPHome device name if you
      # changed it in esphome/cyrus-remote.yaml.
      - service: esphome.cyrus_remote_set_startup_volume
        data:
          volume: "{{ states('input_number.cyrus_startup_volume') | int }}"
      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.cyrus_remote_cyrus_volume_set
            to: "on"
        timeout: "30"
        continue_on_timeout: true
