# Home Assistant package: power-on volume init for a Cyrus ONE / ONE HD
# amplifier controlled through an ESP32 running the firmware from the
# `esphome/` directory of this repository.
#
# The amplifier is powered through a Shelly Plug S Gen3 that the ESP32
# switches directly over Shelly RPC (see the `shelly_plug_ip` substitution
# in esphome/cyrus-remote.yaml). The HA-facing entity is
# `switch.cyrus_remote_cyrus_amp_plug`. If you prefer your own plug
# integration instead, point the `switch.amplifier_plug` entity ids below to
# it - that is the only thing you would need to adjust.
#
# All day-to-day control entities (plug switch, volume slider, source
# select, mute, ...) come from the ESPHome integration automatically once
# the ESP32 is added to Home Assistant. This package only covers the
# power-on flow:
#
#   plug switch on -> ESP32 switches the Shelly -> amp boots -> ESP32 scans
#   for the amp (two-MAC boot sequence) -> connects -> writes the startup
#   volume -> stays connected as the BLE relay ->
#   `binary_sensor.<device>_cyrus_volume_set` pulses on success.
#
# Include this file from configuration.yaml, e.g.:
#   homeassistant:
#     packages: !include_dir_named packages
# and place this file as packages/cyrus_remote.yaml.

# Absolute startup volume 0-90 (36 = roughly -40 dB on the Cyrus scale).
# Change this to taste. Clamped to the Cyrus Volume Limit on the ESP32.
input_number:
  cyrus_startup_volume:
    name: "Cyrus startup volume"
    min: 0
    max: 90
    step: 1
    initial: 36
    icon: mdi:volume-high

# Single switch to turn the amplifier on/off from the UI.
# Power-off just cuts the plug; power-on runs the volume script below.
template:
  - switch:
      - name: "Cyrus Amp"
        unique_id: cyrus_amp_power_switch
        state: "{{ is_state('switch.cyrus_remote_cyrus_amp_plug', 'on') }}"
        # Blocked while the plug feature is unusable: IP missing/invalid or
        # plug unreachable (see binary_sensor...cyrus_plug_ok), or disabled.
        availability: "{{ is_state('binary_sensor.cyrus_remote_cyrus_plug_ok', 'on') }}"
        turn_on:
          - service: script.cyrus_amp_turn_on_with_volume
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.cyrus_remote_cyrus_amp_plug

automation:
  # Covers the case where the plug is switched on outside of HA
  # (physical button on the plug, vendor app): the ESP32 polls the Shelly
  # state, so the entity below flips within ~10 s and the flow still runs.
  - alias: "Cyrus amp powered on"
    id: cyrus_amp_powered_on
    trigger:
      - platform: state
        entity_id: switch.cyrus_remote_cyrus_amp_plug
        to: "on"
    condition:
      # The script itself turns the plug on; don't run twice.
      - condition: state
        entity_id: script.cyrus_amp_turn_on_with_volume
        state: "off"
    action:
      - service: script.cyrus_amp_turn_on_with_volume

script:
  cyrus_amp_turn_on_with_volume:
    alias: "Turn on Cyrus amp and set volume"
    mode: single
    sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.cyrus_remote_cyrus_amp_plug
      # The ESP32 scans for the two MAC advertisements of the amplifier,
      # connects over BLE, writes the volume and stays connected. It pulses
      # binary_sensor.<device>_cyrus_volume_set when done
      # (normally ~8 s after power-on; 30 s timeout as a safety net).
      # NOTE: replace `cyrus_remote` with your ESPHome device name if you
      # changed it in esphome/cyrus-remote.yaml.
      - service: esphome.cyrus_remote_set_startup_volume
        data:
          volume: "{{ states('input_number.cyrus_startup_volume') | int }}"
      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.cyrus_remote_cyrus_volume_set
            to: "on"
        timeout: "30"
        continue_on_timeout: true

  # The volume slider range is only announced to HA at connect time, so a
  # live volume-limit change flags binary_sensor...restart_required. Surface
  # it as a notification; pressing the button.cyrus_remote_cyrus_restart
  # button reboots the ESP32 and the new slider range appears.
  - alias: "Cyrus restart required after limit change"
    id: cyrus_restart_required_notify
    trigger:
      - platform: state
        entity_id: binary_sensor.cyrus_remote_cyrus_restart_required
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Cyrus: restart required"
          message: >-
            The volume limit changed. Press button.cyrus_remote_cyrus_restart
            to reboot the controller and apply the new volume slider range.
          notification_id: cyrus_restart_required

  # Plug configuration problems reported by the ESP32: "not configured"
  # (feature enabled but shelly_plug_ip missing/invalid) or "unreachable"
  # (no Shelly answering at the configured IP). "disabled" is a deliberate
  # opt-out and raises nothing.
  - alias: "Cyrus plug configuration problem"
    id: cyrus_plug_problem_notify
    trigger:
      - platform: state
        entity_id: sensor.cyrus_remote_cyrus_plug_diagnostic
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state in ['not configured', 'unreachable'] }}
    action:
      - service: persistent_notification.create
        data:
          title: "Cyrus: plug configuration problem"
          message: >-
            Shelly plug: {{ trigger.to_state.state }}.
            {{ 'Set shelly_plug_ip under cyrus_ble: in esphome/cyrus-remote.yaml (validated IPv4), or set shelly_plug_enabled: false if you do not use a smart plug.' if trigger.to_state.state == 'not configured' else 'Check that the Shelly Plug S Gen3 is powered, on the same LAN as the ESP32, and has local authentication disabled (Digest auth is not supported).' }}
          notification_id: cyrus_plug_problem

  - alias: "Cyrus plug configuration OK"
    id: cyrus_plug_problem_dismiss
    trigger:
      - platform: state
        entity_id: sensor.cyrus_remote_cyrus_plug_diagnostic
        to:
          - "ok"
          - "disabled"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: cyrus_plug_problem
